# plant's own controls: each plants a broken copy of a source file and
# expects a named self-test to go red. The plants are generated and checked by
# tests/plants.rs. Run: `plant` from the repository root.
#
# To share compiled dependencies between the scratch copies, set
# CARGO_TARGET_DIR to a dedicated absolute directory, never this repository's
# own target/: cargo copies each build's binary to the shared
# <target>/debug/plant, so a planted build would replace your real binary.

[[control]]
id = "fail-open"
check = "Test"
run = "cargo test --test selftest fail_open_is_fail"
plant = "ci-controls/fail-open"
stderr_or_stdout_matches = 'test fail_open_is_fail \.\.\. FAILED'

[[control]]
id = "red-baseline"
check = "Test"
run = "cargo test --test selftest baseline_red_is_fail"
plant = "ci-controls/red-baseline"
stderr_or_stdout_matches = 'test baseline_red_is_fail \.\.\. FAILED'

[[control]]
id = "missing-plant"
check = "Test"
run = "cargo test --test selftest missing_plant_is_fail"
plant = "ci-controls/missing-plant"
stderr_or_stdout_matches = 'test missing_plant_is_fail \.\.\. FAILED'

[[control]]
id = "timeout"
check = "Test"
run = "cargo test --test selftest timeout_is_fail_and_kills_the_group"
plant = "ci-controls/timeout"
stderr_or_stdout_matches = 'test timeout_is_fail_and_kills_the_group \.\.\. FAILED'

[[control]]
id = "empty-manifest"
check = "Test"
run = "cargo test --test selftest empty_manifest_exits_1"
plant = "ci-controls/empty-manifest"
stderr_or_stdout_matches = 'test empty_manifest_exits_1 \.\.\. FAILED'

[[control]]
id = "kill-shell-only"
check = "Test"
run = "cargo test --test selftest timeout_is_fail_and_kills_the_group"
plant = "ci-controls/kill-shell-only"
stderr_or_stdout_matches = 'survived the timeout'

[[control]]
id = "action-allows-prt"
check = "Test"
run = "cargo test --test action refuses_pull_request_target"
plant = "ci-controls/action-allows-prt"
stderr_or_stdout_matches = 'plant ran under pull_request_target'

[[control]]
id = "action-uploads-other-file"
check = "Test"
run = "cargo test --test action action_uploads_the_report_it_writes_even_when_plant_fails"
plant = "ci-controls/action-uploads-other-file"
stderr_or_stdout_matches = 'uploads another file than the run step writes'

[[control]]
id = "action-upload-skipped-on-red"
check = "Test"
run = "cargo test --test action action_uploads_the_report_it_writes_even_when_plant_fails"
plant = "ci-controls/action-upload-skipped-on-red"
stderr_or_stdout_matches = 'the report upload is skipped when plant fails'

[[control]]
id = "collect-oldest-report"
check = "Test"
run = "cargo test --test census_collect collect_writes_the_census_inputs_for_a_repository"
plant = "ci-controls/collect-oldest-report"
stderr_or_stdout_matches = 'collected a report other than the newest from the default branch'

[[control]]
id = "collect-unreadable-as-empty"
check = "Test"
run = "cargo test --test census_collect collect_stops_when_branch_protection_cannot_be_read"
plant = "ci-controls/collect-unreadable-as-empty"
stderr_or_stdout_matches = 'an unreadable branch protection was read as no required checks'

[[control]]
id = "release-tag-mismatch"
check = "Test"
run = "cargo test --test release version_guard_rejects_a_mismatch"
plant = "ci-controls/release-tag-mismatch"
stderr_or_stdout_matches = 'tag v9\.9\.9 accepted'

[[control]]
id = "release-wrong-version"
check = "Test"
run = "cargo test --test release smoke_rejects_a_binary_of_another_version"
plant = "ci-controls/release-wrong-version"
stderr_or_stdout_matches = 'a binary of another version passed the smoke test'

[[control]]
id = "release-branch-ref"
check = "Test"
run = "cargo test --test release ref_guard_accepts_only_a_release_tag"
plant = "ci-controls/release-branch-ref"
stderr_or_stdout_matches = 'a branch ref passed the ref guard'

# plant guard must reject a self-hosted job without the fail-closed form
[[control]]
id = "guard-unguarded-site"
check = "plant guard"
run = "cargo run -q -- guard"
plant = "ci-controls/guard-unguarded-site"
stderr_or_stdout_matches = 'ci\.yml:\d+ \(self-controls\): runs-on is not a hosted image'

# plant guard must reject a runner label outside plant-guard.toml (loom#532)
[[control]]
id = "guard-bad-label"
check = "plant guard"
run = "cargo run -q -- guard"
plant = "ci-controls/guard-bad-label"
stderr_or_stdout_matches = 'ci\.yml:\d+ \(self-controls\): runner label "\}\.\$l\.q\{" is not in plant-guard\.toml labels'


# plant census (bet B): each plant breaks one condition for the fixture's one
# covered context, acme/alpha Test; the census must name that reason.

[[control]]
id = "census-exit0-counted"
check = "Test"
run = "cargo test --test census census_matches_the_committed_expected_file"
plant = "ci-controls/census-exit0-counted"
stderr_or_stdout_matches = 'test-catches-overflow: the planted run exited 0'

[[control]]
id = "census-run-not-in-job"
check = "Test"
run = "cargo test --test census census_matches_the_committed_expected_file"
plant = "ci-controls/census-run-not-in-job"
stderr_or_stdout_matches = 'test-catches-overflow: run is not a whole command line of a step in the job'

[[control]]
id = "census-baseline-false"
check = "Test"
run = "cargo test --test census census_matches_the_committed_expected_file"
plant = "ci-controls/census-baseline-false"
stderr_or_stdout_matches = 'test-catches-overflow: baseline = false'

[[control]]
id = "census-stale-report"
check = "Test"
run = "cargo test --test census census_matches_the_committed_expected_file"
plant = "ci-controls/census-stale-report"
stderr_or_stdout_matches = 'test-catches-overflow: report dated 2026-10-31 is not in 2026-11'

[[control]]
id = "census-unverified-runner"
check = "Test"
run = "cargo test --test census census_matches_the_committed_expected_file"
plant = "ci-controls/census-unverified-runner"
stderr_or_stdout_matches = 'test-catches-overflow: report is not from a verified plant release'

[[control]]
id = "census-aggregate-counted"
check = "Test"
run = "cargo test --test census census_matches_the_committed_expected_file"
plant = "ci-controls/census-aggregate-counted"
stderr_or_stdout_matches = '"context": "Test",\s*"class": "aggregate"'
