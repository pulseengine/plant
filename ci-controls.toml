# plant's own controls: each plants a broken copy of a source file and
# expects a named self-test to go red. The plants are generated and checked by
# tests/plants.rs. Run: `plant` from the repository root.
#
# To share compiled dependencies between the scratch copies, set
# CARGO_TARGET_DIR to a dedicated absolute directory, never this repository's
# own target/: cargo copies each build's binary to the shared
# <target>/debug/plant, so a planted build would replace your real binary.

[[control]]
id = "fail-open"
check = "Test"
run = "cargo test --test selftest fail_open_is_fail"
plant = "ci-controls/fail-open"
stderr_or_stdout_matches = 'test fail_open_is_fail \.\.\. FAILED'

[[control]]
id = "red-baseline"
check = "Test"
run = "cargo test --test selftest baseline_red_is_fail"
plant = "ci-controls/red-baseline"
stderr_or_stdout_matches = 'test baseline_red_is_fail \.\.\. FAILED'

[[control]]
id = "missing-plant"
check = "Test"
run = "cargo test --test selftest missing_plant_is_fail"
plant = "ci-controls/missing-plant"
stderr_or_stdout_matches = 'test missing_plant_is_fail \.\.\. FAILED'

[[control]]
id = "timeout"
check = "Test"
run = "cargo test --test selftest timeout_is_fail_and_kills_the_group"
plant = "ci-controls/timeout"
stderr_or_stdout_matches = 'test timeout_is_fail_and_kills_the_group \.\.\. FAILED'

[[control]]
id = "empty-manifest"
check = "Test"
run = "cargo test --test selftest empty_manifest_exits_1"
plant = "ci-controls/empty-manifest"
stderr_or_stdout_matches = 'test empty_manifest_exits_1 \.\.\. FAILED'

[[control]]
id = "kill-shell-only"
check = "Test"
run = "cargo test --test selftest timeout_is_fail_and_kills_the_group"
plant = "ci-controls/kill-shell-only"
stderr_or_stdout_matches = 'survived the timeout'

[[control]]
id = "action-allows-prt"
check = "Test"
run = "cargo test --test action refuses_pull_request_target"
plant = "ci-controls/action-allows-prt"
stderr_or_stdout_matches = 'plant ran under pull_request_target'

[[control]]
id = "release-tag-mismatch"
check = "Test"
run = "cargo test --test release version_guard_rejects_a_mismatch"
plant = "ci-controls/release-tag-mismatch"
stderr_or_stdout_matches = 'tag v9\.9\.9 accepted'

[[control]]
id = "release-wrong-version"
check = "Test"
run = "cargo test --test release smoke_rejects_a_binary_of_another_version"
plant = "ci-controls/release-wrong-version"
stderr_or_stdout_matches = 'a binary of another version passed the smoke test'

# plant guard must reject a self-hosted job without the fail-closed form
[[control]]
id = "guard-unguarded-site"
check = "plant guard"
run = "cargo run -q -- guard"
plant = "ci-controls/guard-unguarded-site"
stderr_or_stdout_matches = 'ci\.yml:\d+ \(self-controls\): runs-on is not a hosted image'

# plant guard must reject a runner label outside plant-guard.toml (loom#532)
[[control]]
id = "guard-bad-label"
check = "plant guard"
run = "cargo run -q -- guard"
plant = "ci-controls/guard-bad-label"
stderr_or_stdout_matches = 'ci\.yml:\d+ \(self-controls\): runner label "\}\.\$l\.q\{" is not in plant-guard\.toml labels'

