# plant's false-skip controls for sieve, the shared CI path classifier.
#
# The check: for the changed paths in .plant/changed.md, sieve selects
# nothing (every line of its github-output is `=false`). The baseline lists
# only docs, so it must pass: a docs-only change selects no class and does
# not run everything. Each plant replaces the list with a change that must
# select something. If sieve skips a class that the change touches, the
# planted run stays green, and plant reports FAIL-OPEN: a false skip.
#
# The true inputs planted here come from cargo's own build (dep-info of the
# crates each class builds), checked by plant's tests/sieve_fixture.rs, not
# from `sieve graph`.

[[control]]
id = "core-via-path-module"
check = "sieve selects nothing for docs"
run = "out=$(env -u GITHUB_OUTPUT sieve classify --config sieve.toml --paths-file .plant/changed.md --format github-output) && printf '%s\\n' \"$out\" && printf '%s\\n' \"$out\" | grep -qx 'run_all=false' && ! printf '%s\\n' \"$out\" | grep -q '=true$'"
plant = "ci-controls/core-via-path-module"
stderr_or_stdout_matches = '(?ms)^run_all=false$.*^core=true$'
timeout = 60

