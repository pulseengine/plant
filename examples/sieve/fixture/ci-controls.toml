# A workflow change runs everything, and says why: a path reason, never an
# `internal:` one.
[[control]]
id = "workflow-runs-all"
check = "sieve selects nothing for docs"
run = "out=$(env -u GITHUB_OUTPUT sieve classify --config sieve.toml --paths-file .plant/changed.md --format github-output) && printf '%s\\n' \"$out\" && printf '%s\\n' \"$out\" | grep -qx 'run_all=false' && ! printf '%s\\n' \"$out\" | grep -q '=true$'"
plant = "ci-controls/workflow-runs-all"
stderr_or_stdout_matches = 'run_all \(run-all path: \.github/workflows/ci\.yml is CI'
timeout = 60

# A new top-level path no class claims runs everything.
[[control]]
id = "unknown-path-runs-all"
check = "sieve selects nothing for docs"
run = "out=$(env -u GITHUB_OUTPUT sieve classify --config sieve.toml --paths-file .plant/changed.md --format github-output) && printf '%s\\n' \"$out\" && printf '%s\\n' \"$out\" | grep -qx 'run_all=false' && ! printf '%s\\n' \"$out\" | grep -q '=true$'"
plant = "ci-controls/unknown-path-runs-all"
stderr_or_stdout_matches = 'run_all \(run-all path: newtool/x\.rs is claimed by no class\)'
timeout = 60
