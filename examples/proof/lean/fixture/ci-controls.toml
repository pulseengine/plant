# The Lean proof-gate pack, against the fixture's real gate (check.sh: lake build
# plus an axiom audit that allows only propext, Classical.choice and
# Quot.sound). Every control must PASS.

[[control]]
id = "lean-sorry"
check = "proof check with axiom audit"
run = "./check.sh"
plant = "ci-controls/lean-sorry"
stderr_or_stdout_matches = 'disallowed axiom\(s\): sorryAx'
timeout = 600

[[control]]
id = "lean-axiom"
check = "proof check with axiom audit"
run = "./check.sh"
plant = "ci-controls/lean-axiom"
stderr_or_stdout_matches = 'disallowed axiom\(s\): Fixture\.cheat'
timeout = 600
