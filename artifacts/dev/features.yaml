      sieve-controls CI job, and tests/sieve_fixture.rs, the dep-info oracle.
      Interface: seam pulseengine/sieve#3.
    release: v0.3.0
    fields:
      phase: phase-2
      acceptance-criteria:
        - all six controls PASS against the pinned sieve release (v0.1.0, then v0.2.0)
        - against a sieve that selects nothing, all six report FAIL-OPEN
        - a planted path that is not a class input by dep-info fails the oracle test
    links:
