# Top-level requirements (draft, 2026-11-14), derived from docs/DESIGN.md.
artifacts:
  - id: REQ-001
    type: requirement
    title: Verdict rules
    status: draft
    description: >
      plant shall apply the verdict rules of docs/DESIGN.md: a control fails on
      a green planted run, a red baseline, a timeout, exit 126/127, a regex
      mismatch, a missing or empty plant, or an invalid delete entry.
    release: v0.1.0
    fields: {priority: must, category: functional}
    links:
      - type: constraint-satisfies
        target: SC-1
      - type: constraint-satisfies
        target: SC-2

  - id: REQ-002
    type: requirement
    title: Exit codes 0/1/2
    status: draft
    description: >
      plant shall exit 0 when every control passes, 1 when any control fails or
      none ran, and 2 when it cannot run (bad manifest, no git, no commit,
      unknown --only id).
    release: v0.1.0
    fields: {priority: must, category: interface}
    links:
      - type: constraint-satisfies
        target: SC-2

  - id: REQ-003
    type: requirement
    title: Manifest parsing is strict
    status: draft
    description: >
      plant shall reject unknown keys, duplicate ids, wrong types, a bad regex,
      expect values other than "fail", and plant paths escaping the root.
    release: v0.1.0
    fields: {priority: must, category: interface}
    links:
      - type: constraint-satisfies
        target: SC-1
      - type: satisfies
        target: SSC-2

  - id: REQ-004
    type: requirement
    title: Scratch copies of HEAD
    status: draft
    description: >
      plant shall export HEAD once, copy it per run, reset it between baseline
      and planted run, overlay the plant from the working tree, apply delete
      lists inside the root only, and remove all scratch on exit.
    release: v0.1.0
    fields: {priority: must, category: functional}
    links:
      - type: constraint-satisfies
        target: SC-3
      - type: constraint-satisfies
        target: SC-6
      - type: satisfies
        target: SSC-2

  - id: REQ-005
    type: requirement
    title: Timeouts kill the whole process group
    status: draft
    release: v0.1.0
    fields: {priority: must, category: functional}
    links:
      - type: constraint-satisfies
        target: SC-4

  - id: REQ-006
    type: requirement
    title: Reporting in text and JSON
    status: draft
    description: >
      plant shall print one PASS/FAIL line per control with its reason and the
      output tail for failures, a summary, and the same data with --format
      json; --only ID runs one control.
    release: v0.1.0
    fields: {priority: must, category: interface}
    links:
      - type: constraint-satisfies
        target: SC-5

  - id: REQ-007
    type: requirement
    title: plant's own CI plants its failure modes
    status: draft
    description: >
      plant's CI shall run plant on its own ci-controls.toml and its tests
      shall plant fail-open, red-baseline, missing-plant, timeout and
      empty-manifest cases, each expected red.
    release: v0.1.0
    fields: {priority: must, category: non-functional}
    links:
      - type: constraint-satisfies
        target: SC-1
      - type: constraint-satisfies
        target: SC-2

  - id: REQ-008
    type: requirement
    title: CI and action never expose self-hosted runners to forks
    status: draft
    release: v0.1.0
    fields: {priority: must, category: constraint}
    links:
      - type: satisfies
        target: SSC-1

  - id: REQ-009
    type: requirement
    title: GitHub Action wrapper that cannot be pointed at fork code with secrets
    status: draft
    description: >
      plant shall ship a GitHub Action that runs plant on the caller's
      manifest, refuses to run under pull_request_target, passes every input
      to its scripts only through the environment, and fails the step with
      plant's exit code.
    release: v0.1.0
    fields: {priority: must, category: interface}
    links:
      - type: satisfies
        target: SSC-1
      - type: satisfies
        target: SSC-2
      - type: constraint-satisfies
        target: SC-2

  - id: REQ-010
    type: requirement
    title: Signed, attested release artifacts that report their own version
    status: draft
    description: >
      plant's release workflow shall refuse a tag that does not name the
      crate version, smoke-test every packaged binary (its version equals the
      tag, and it gives both a PASS and a FAIL-OPEN verdict on a fixture),
      put the archives, a CycloneDX SBOM and a docs archive into
      SHA256SUMS.txt before signing it with cosign keyless, and attach SLSA
      provenance to the archives. It shall build, attest and sign only in a
      run whose ref is a v* tag, so the signing identity is always
      release.yml@refs/tags/<tag>.
    release: v0.1.0
    fields: {priority: must, category: interface}
    links:
      - type: satisfies
        target: SSC-3

  - id: REQ-011
    type: requirement
    title: plant guard rejects any workflow line that can route a fork PR to a self-hosted runner
    status: draft
    description: >
      `plant guard` shall read every .github/workflows/*.yml and *.yaml and
      fail (exit 1) unless every runs-on is a hosted image, the fail-closed
      same-repo form with the configured hosted fallback, its matrix variant,
      or a plain matrix reference whose every value is a hosted image; every
      other line naming self-hosted is a matrix runner under the matrix form;
      and no workflow with a self-hosted job has a trigger outside push,
      pull_request, schedule, workflow_dispatch and merge_group. It shall fail
      when it finds no self-hosted selection (compared nothing), when a
      workflow does not parse as YAML, when a job has neither runs-on nor a
      local `uses:`, or calls a reusable workflow from another repository
      that is not admitted by trusted_workflows,
      and exit 2 when the workflows or the config cannot be read. Ported from relay's
      scripts/check-selfhosted-fork-guard.rs (relay f852816).
    release: v0.2.0
    fields: {priority: must, category: functional}
    links:
      - type: satisfies
        target: SSC-1

  - id: REQ-012
    type: requirement
    title: plant guard rejects runner labels outside the declared set
    status: draft
    description: >
      `plant guard` shall read the provisioned labels from plant-guard.toml
      and fail on any label in a self-hosted fromJSON list, a matrix runner
      list or an exempt workflow's runs-on that is not in that set. A
      self-hosted line with no declared label set fails.
    release: v0.2.0
    fields: {priority: must, category: functional}
    links:
      - type: satisfies
        target: SSC-4

  - id: REQ-013
    type: requirement
    title: plant guard exemptions hold only for workflows a fork cannot trigger
    status: draft
    description: >
      plant-guard.toml may exempt a workflow, with a reason, from the
      fail-closed form. `plant guard` shall honour the exemption only when
      every trigger of that workflow is schedule, workflow_dispatch or push;
      otherwise the exemption itself is a violation. An exemption naming a
      workflow that does not exist is a violation. Labels are still checked.
    release: v0.2.0
    fields: {priority: must, category: functional}
    links:
      - type: satisfies
        target: SSC-1

  - id: REQ-014
    type: requirement
    title: plant's controls show a false skip by sieve as FAIL-OPEN
    status: draft
    description: >
      examples/sieve shall hold a fixture with sieve classes, whose check
      passes only when sieve selects nothing for a docs-only change. It
      shall hold plants that must each turn that check red: a true input of
      every class, reached through a #[path] module, an include_str!, a path
      dependency and a crate's own source, plus a workflow file and an
      unknown top-level path, which must run everything with a path reason.
      A false skip by sieve then shows as FAIL-OPEN. The planted true inputs
      shall be checked against cargo's dep-info, not against `sieve graph`,
      and CI shall run the controls against a sieve release pinned by
      digest.
    release: v0.3.0
    fields: {priority: must, category: functional}
    links:
      - type: satisfies
        target: SC-1

  - id: REQ-015
    type: requirement
    title: plant ships planted proof escapes that a proof gate must reject
    status: draft
    release: v0.4.0
    description: >
      Serves O3 (indicator: proof-carrying repositories whose proof check, with a kernel axiom audit and a trust-escape ledger, is a required check). examples/proof shall hold controls for Lean (sorry, axiom) and Kani (an input-narrowing kani::assume) that turn a proof check, its axiom audit or its ledger red, each with a regex; a stand-in check that only type-checks shall turn the axiom and assume controls FAIL-OPEN. A manifest key may keep a shallow .git in the scratch copy for ledger checks. Plan: docs/plan/v0.4.0.md, bet A.
    fields: {priority: should, category: functional}
    links:
      - type: satisfies
        target: SC-1

  - id: REQ-016
    type: requirement
    title: plant census reports which required checks a planted input turned red
    status: implemented
    release: v0.5.1
    description: >
      Serves O3 (summary: each claim maps to a CI check that can fail); not the O3 indicator. `plant census` shall map required contexts, workflows, manifests and CI reports to plant.census.v1, counting a context as covered only when the control is bound to its job step, went red with a regex on a green baseline, and the report is fresh, from a default-branch CI run, and from a verified plant release. plant run reports shall carry the schema plant.report.v1. Plan: bet B.
    fields: {priority: should, category: functional}
    links:
      - type: satisfies
        target: SC-1

  - id: REQ-017
    type: requirement
    title: plant ships negative controls for the one-command evidence bundle
    status: draft
    release: v0.6.0
    description: >
      Serves O2 (guard: the verify command must fail when any piece of evidence is removed). examples/bundle shall hold controls that remove or alter each of the rivet trace, witness report and sigil attestation, all of which the verify command must reject, with a stand-in that only checks existence turning them FAIL-OPEN. Plan: bet C; dropped if no single verify command exists.
    fields: {priority: should, category: functional}
    links:
      - type: satisfies
        target: SC-1

  - id: REQ-018
    type: requirement
    title: plant guard runs as a signed WASI component with an equivalence test
    status: draft
    release: v0.6.0
    description: >
      Serves O5 (indicator: tools and gates running as signed WASI components under kiln, wasmtime as the differential). plant guard shall build from a pure core for wasm32-wasip2, be signed in the release, and be held byte-identical to the native plant guard by a CI equivalence job under wasmtime and kiln. Plan: bet D; gated on kiln running a wasip2 command component.
    fields: {priority: should, category: functional}
    links:
      - type: satisfies
        target: SSC-3

  - id: REQ-031
    type: requirement
    title: plant's CI holds every Cargo.lock in the tree committed, audited and binding
    status: implemented
    description: >
      Every Cargo workspace in plant's tree, nested fixture workspaces included, shall have a committed Cargo.lock that cargo-audit reads clean and that `cargo metadata --locked` would not change; the build and test steps shall run with --locked. Workspaces are found from the Cargo.toml files, not from a list. Verified by ci-controls.lockfiles.toml, which plants a stale, a missing and a vulnerable lock in the nested workspace examples/sieve/fixture/tools; a gate that reads only the root lock turns all three FAIL-OPEN. Lockfile sweep, 2026-11-20.
    release: v0.4.0
    fields: {priority: should, category: functional}
    links:
      - type: satisfies
        target: SC-1

  - id: REQ-032
    type: requirement
    title: plant guard admits another repository's reusable workflow only when listed, SHA-pinned and called from trusted triggers
    status: implemented
    description: >
      A job that calls a reusable workflow from another repository shall pass plant guard only when the call's path matches a `trusted_workflows` entry in plant-guard.toml (owner/repo/.github/workflows/<file>.yml or .yaml, `*` allowed only as the file name), the ref is a 40-hex commit SHA, the job has no runs-on, and every trigger of the calling workflow is trusted (workflow_call among them). Trusted calls count as compared. A local `./` call shall get the same caller-trigger check, so a caller under pull_request_target cannot reach a self-hosted job through a workflow_call workflow. plant#33.
    release: v0.4.0
    fields: {priority: must, category: functional}
    links:
      - type: satisfies
        target: SSC-1

  - id: REQ-033
    type: requirement
    title: Planted manifests and lockfiles are stored under a name dependency bots do not read
    status: implemented
    description: >
      A plant file named `<name>.planted` shall be written into the scratch copy as `<name>`, a plant holding both shall be refused, and plant shall warn on stderr about a plant file stored under a manifest or lockfile name (Cargo.lock, package.json, ...). Dependency bots read those names anywhere in the tree; a deliberately vulnerable planted lock otherwise raises an alert and a PR that would weaken the control (seen in jig, jig#9). plant's own lock-controls store their planted Cargo files as `.planted`.
    release: v0.5.0
    fields: {priority: should, category: functional}
    links:
      - type: satisfies
        target: SC-1

  - id: REQ-034
    type: requirement
    title: plant ships a lockfile control pack other repositories can adopt
    status: implemented
    description: "examples/locks shall hold a fixture with a root and a nested Cargo workspace, a gate (check.sh, byte-identical to plant's scripts/lockfiles.sh) and three manifests: the real gate rejects a stale, a missing and a vulnerable nested lock (3 PASS); a stand-in that reads only the root lock must report all three FAIL-OPEN; a vulnerable lock under target/ must report FAIL-OPEN against the real gate (blind). The lockfiles CI job runs the pack. Planted lock and manifest files use the .planted suffix. Owner approval for per-class control packs in the shared CI baseline pilot, 2026-11-21."
    release: v0.5.0
    fields:
      category: functional
      priority: should
    links:
      - type: satisfies
        target: SC-1
