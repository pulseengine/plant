version: 2
# Grouped monthly updates (fleet template from pulseengine/rivet, owner
# decision 2026-11-21). Every entry runs monthly (the 1st, 02:00 UTC), keeps at
# most 2 PRs open, and waits 7 days after a release (cooldown). Majors stay
# ungrouped, one PR each. Security updates ignore the schedule and the limit.
#
# cargo reads the root workspace only. The workspaces under examples/ are
# test fixtures whose locks are part of planted controls; a bump there would
# change what the controls test, so they are not listed.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
