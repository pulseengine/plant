name: Release

# Builds, checks, signs and publishes a release for a v* tag. Modelled on
# pulseengine/synth's release.yml (Phase 6 onward): binary archives, a
# CycloneDX SBOM and a docs archive, all inside SHA256SUMS.txt, which cosign
# signs keyless; SLSA provenance for the archives; build-env.txt.
#
# Signing happens only in a run for a tag ref: the keyless certificate then
# names release.yml@refs/tags/<tag>, which is the identity varve and the
# notes' verify command accept. There is no workflow_dispatch: a run from a
# branch would sign the sums under a branch identity. To retry a
# failed tag run, use "Re-run failed jobs", which keeps the tag ref.
# scripts/release-check.sh ref-guard fails any run whose ref is not a v* tag,
# first before the build and again right before signing.
#
# Runners: GitHub-hosted on purpose, unlike ci.yml. The trigger is a tag push
# (never a pull request), the builds that get signed
# provenance run on fresh ephemeral machines, macOS has no self-hosted pool,
# and the self-hosted runners have no gh for the upload. tests/workflows.rs
# holds this file to hosted images and to no pull_request trigger.
#
# Hosted images are pinned (ubuntu-24.04, not ubuntu-latest, which moves to
# 26.04): moving to a new image is a deliberate PR, run advisory first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # The tag must name Cargo.toml's version before anything compiles
  # (varve#38: a binary that reports the previous version).
  version-guard:
    name: Tag names the crate version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compare the tag with Cargo.toml
        run: |
          set -euo pipefail
          scripts/release-check.sh ref-guard "$GITHUB_REF"
          VERSION="${GITHUB_REF#refs/tags/}"
          scripts/release-check.sh version-guard "$VERSION"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: [version-guard]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl builds: no loader and no glibc floor.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          # x86_64 cross-compiles on the arm64 runner; the smoke test runs it
          # under Rosetta 2.
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable, 2026-11-15
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build plant
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET"

      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCHIVE="plant-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging
          cp "target/${TARGET}/release/plant" staging/
          strip staging/plant
          cp README.md LICENSE staging/
          tar -czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The archive a user downloads, not the loose build output: it must be
      # the tag's version and give both verdicts on a fixture.
      - name: Smoke-test the packaged binary
        run: |
          set -euo pipefail
          mkdir -p smoke
          tar -xzf "$ARCHIVE" -C smoke
          scripts/release-check.sh smoke smoke/plant "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  # The SBOM tool runs here, with a read-only token, not in the job that
  # can sign and publish.
  sbom:
    name: SBOM (CycloneDX)
    needs: [version-guard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx --version 0.5.10

      - name: Generate the SBOM
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path Cargo.toml --format json --spec-version 1.5
          src=$(find . -maxdepth 1 -name '*.cdx.json' | head -1)
          test -n "$src" && test -s "$src"
          mkdir -p sbom && cp "$src" sbom/plant.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom/plant.cdx.json
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [build-binaries, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BARE=${VERSION#v}" >> "$GITHUB_ENV"
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          n=$(ls release-assets/*.tar.gz | wc -l)
          test "$n" -eq 4 || { echo "expected 4 archives, found $n"; exit 1; }
          ls -la release-assets/

      # The SBOM goes in before the sums, so its digest is signed too.
      - name: Add the SBOM
        run: cp artifacts/sbom/plant.cdx.json "release-assets/plant-${BARE}.cdx.json"

      # Docs archive before the sums, so a varve layer can ingest it through
      # the signed digest: README, DESIGN and every `plant docs` topic, taken
      # from the released x86_64 binary itself.
      - name: Build the docs archive
        run: |
          set -euo pipefail
          mkdir -p bin "docs-out/plant-${BARE}-docs"
          tar -xzf "release-assets/plant-${VERSION}-x86_64-unknown-linux-musl.tar.gz" -C bin
          out="docs-out/plant-${BARE}-docs"
          cp README.md "$out/"
          cp docs/DESIGN.md "$out/"
          topics=$(bin/plant docs | sed -n 's/^  \([a-z-]*\) .*/\1/p')
          test -n "$topics"
          for t in $topics; do bin/plant docs "$t" > "$out/$t.md"; done
          tar -czf "release-assets/plant-${BARE}-docs.tar.gz" -C docs-out .
          tar -tzf "release-assets/plant-${BARE}-docs.tar.gz"

      # Inside the sums, so it is signed. The archives were built in the
      # build-binaries jobs with the same pinned toolchain action.
      - name: Capture build environment
        run: |
          set -euo pipefail
          {
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
            echo "cosign: v2.4.1 (sigstore/cosign-installer, pinned below)"
            echo "runner: $(uname -srm)"
          } > release-assets/build-env.txt
          cat release-assets/build-env.txt

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Nothing is attested or signed from a branch, whatever started the run.
      - name: Sign only from a tag ref
        run: scripts/release-check.sh ref-guard "$GITHUB_REF"

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release-assets/*.tar.gz"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.4.1'

      # Verify with:
      #   cosign verify-blob \
      #     --certificate-identity-regexp '^https://github.com/pulseengine/plant/.github/workflows/release.yml@refs/tags/v.*$' \
      #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      #     --bundle SHA256SUMS.txt.cosign.bundle SHA256SUMS.txt
      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        run: |
          set -euo pipefail
          cd release-assets
          cosign sign-blob \
            --yes \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Work in progress; no production-ready claims.

          Verify this release:

              cosign verify-blob \\
                --certificate-identity-regexp '^https://github.com/pulseengine/plant/.github/workflows/release.yml@refs/tags/v.*$' \\
                --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\
                --bundle SHA256SUMS.txt.cosign.bundle SHA256SUMS.txt
              sha256sum -c --ignore-missing SHA256SUMS.txt
              gh attestation verify plant-${VERSION}-<target>.tar.gz --repo pulseengine/plant
              grep -- '-docs.tar.gz\$' SHA256SUMS.txt
          EOF
          # Never overwrite published assets: to re-run, delete the release.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; delete it before re-running" >&2
            exit 1
          fi
          gh release create "$VERSION" --verify-tag --title "plant $VERSION" \
            --notes-file "$notes" --prerelease release-assets/*
