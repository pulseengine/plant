name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# `shell: bash` runs with -eo pipefail, so a piped gate reports its own exit.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  # The rivet release CI validates with; matches the varve.toml layer (2026.11.10).
  RIVET_VERSION: v0.41.1

jobs:
  test:
    name: Test
    # Fork PRs never reach self-hosted runners (fail-closed same-repo guard).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets --no-fail-fast

  self-controls:
    name: plant self-controls
    # Fork PRs never reach self-hosted runners (fail-closed same-repo guard).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build plant
        run: cargo build
      # plant holds itself to its own rule: each control plants a broken source
      # file and needs the named self-test to go red. Exit 1 on any fail-open
      # control and on an empty manifest.
      - name: plant on ci-controls.toml
        env:
          # A dedicated dir: never the build's own target/ (see ci-controls.toml).
          CARGO_TARGET_DIR: ${{ runner.temp }}/plant-controls-target
        run: ./target/debug/plant --format json | tee plant-report.json

  rivet:
    name: rivet validate
    # Fork PRs never reach self-hosted runners (fail-closed same-repo guard).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fetch pinned rivet release
        run: |
          d="$RUNNER_TEMP/rivet"; mkdir -p "$d"; cd "$d"
          asset="rivet-$RIVET_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/pulseengine/rivet/releases/download/$RIVET_VERSION"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o SHA256SUMS.txt "$base/SHA256SUMS.txt"
          exp=$(grep -E " (\./)?$asset\$" SHA256SUMS.txt | awk '{print $1}')
          act=$(sha256sum "$asset" | awk '{print $1}')
          test -n "$exp" && test "$exp" = "$act" || { echo "checksum mismatch for $asset"; exit 1; }
          tar xzf "$asset"
          echo "$d/$(dirname "$(find . -name rivet -type f | head -1)")" >> "$GITHUB_PATH"
      - name: rivet validate
        run: |
          rivet --version
          rivet validate
      - name: test markers
        run: rivet coverage --tests
