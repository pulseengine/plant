# This repository's toolchain pin. `varve install` lays it down and the shims on
# PATH then run exactly these tools; `varve which <tool>` names the layer and its
# digest. The realm comes from varve-realms.toml beside this file, so no
# environment variable is needed and the realm's trust root is authoritative.
# Change layers only by editing this file in a reviewed commit.
manifest-version = 1

[toolchain]
realm   = "covalent"
channel = "rolling"
layer   = "2026.11.28"
# From `varve list` after `varve install` (counter 29), on 2026-11-27: the first
# covalent layer with kiln 0.9.0 and meld 0.70.0, which CI's guard (kiln) job
# matches. The realm's signed line-index names it (greatest counter 29), and
# `varve verify` checks the manifest against the covalent trust root.
digest  = "sha256:da7f6b48f875349c020e46ba52958f022db4c03b90b70bf91c718ccbbebbbbce"
