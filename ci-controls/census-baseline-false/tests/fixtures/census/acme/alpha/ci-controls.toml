[[control]]
id = "test-catches-overflow"
check = "Test"
run = "cargo test --locked"
plant = "ci-controls/overflow"
stderr_or_stdout_matches = 'attempt to add with overflow'
baseline = false

[[control]]
id = "aggregate-claimed"
check = "all-green"
run = "cargo test --locked"
plant = "ci-controls/overflow"
stderr_or_stdout_matches = 'overflow'
