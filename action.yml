name: plant
description: Prove your CI checks can fail by running them against planted bad inputs
author: pulseengine

# Work in progress, pre-1.0. With `version` set, installs that plant release
# after verifying it (cosign identity of plant's release workflow for that tag,
# sha256 from the signed sums, --version); the runner then needs curl and tar.
# Without it, builds plant from this action's own source, which needs a Rust
# toolchain. Either way it needs git and bash. Do not run it under
# pull_request_target (it refuses), and keep fork pull requests off
# self-hosted runners: plant executes the run commands of ci-controls.toml.

inputs:
  manifest:
    description: Path to the manifest, relative to the working directory
    default: ci-controls.toml
  only:
    description: Space-separated control ids to run (default all)
    default: ""
  format:
    description: Output format, text or json
    default: text
  version:
    description: >-
      plant release to install and verify, e.g. 0.5.0 (default: build from the
      action's source). A json report then records plant_verified = true.
    default: ""
  artifact:
    description: >-
      Upload the report as a CI artifact of this name, also when plant fails
      (default: no upload). The report holds the tail of each control's command
      output, and an artifact is not masked like the log is: leave it empty if a
      control's command can print a secret. Give each plant step its own name.
    default: ""

outputs:
  report:
    description: Path of the file holding plant's output
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: install cosign
      if: inputs.version != ''
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: 'v2.4.1'
    - name: install and verify the plant release
      if: inputs.version != ''
      shell: bash
      env:
        PLANT_VERSION: ${{ inputs.version }}
        PLANT_ROOT: ${{ runner.temp }}/plant-bin
        PLANT_ACTION: ${{ github.action_path }}
      run: '"$PLANT_ACTION/action/install.sh" "$PLANT_VERSION" "$PLANT_ROOT"'
    - name: build plant
      if: inputs.version == ''
      shell: bash
      env:
        PLANT_SRC: ${{ github.action_path }}
        PLANT_ROOT: ${{ runner.temp }}/plant-bin
      run: cargo install --locked --quiet --path "$PLANT_SRC" --root "$PLANT_ROOT"
    - name: run plant
      id: run
      shell: bash
      env:
        PLANT_BIN: ${{ runner.temp }}/plant-bin/bin/plant
        PLANT_MANIFEST: ${{ inputs.manifest }}
        PLANT_ONLY: ${{ inputs.only }}
        PLANT_FORMAT: ${{ inputs.format }}
        PLANT_REPORT: ${{ runner.temp }}/plant-report
        PLANT_ACTION: ${{ github.action_path }}
        PLANT_VERSION: ${{ inputs.version }}
      run: |
        echo "report=$PLANT_REPORT" >> "$GITHUB_OUTPUT"
        "$PLANT_ACTION/action/run.sh"
    - name: upload the report
      if: always() && inputs.artifact != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/plant-report
        if-no-files-found: warn
