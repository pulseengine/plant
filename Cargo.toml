[package]
description = "Prove your CI checks can fail: run each check against planted bad inputs"
license = "Apache-2.0"
repository = "https://github.com/pulseengine/plant"
name = "plant"
version = "0.5.1"
edition = "2021"
rust-version = "1.75"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
yaml-rust2 = "0.13"

# The WASI build exits through wasi:cli/exit's exit-with-code, so plant's
# exit codes 0/1/2 survive; std's exit maps every nonzero code to 1 (REQ-018).
[target.'cfg(target_os = "wasi")'.dependencies]
wasip2 = { version = "=1.0.4", default-features = false }
