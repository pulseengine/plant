[package]
description = "Prove your CI checks can fail: run each check against planted bad inputs"
license = "Apache-2.0"
repository = "https://github.com/pulseengine/plant"
name = "plant"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
